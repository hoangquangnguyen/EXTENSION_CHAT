<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Chat Relayer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <span class="icon">⚡</span>
        <span class="title">TikTok Relayer</span>
      </div>
      <div class="status-indicator disconnected" id="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Warning banner -->
    <div id="warning-banner" class="warning-banner hidden">
      ⚠️ Please navigate to a TikTok Live stream page to start monitoring.
    </div>

    <!-- Error message banner -->
    <div id="error-banner" class="error-banner hidden">
    </div>

    <!-- Active controls card -->
    <div class="control-card">
      <div class="control-info">
        <span class="control-label">Scraper Monitoring</span>
        <span class="control-sub">Start/stop extracting chat DOM</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="monitoring-toggle">
        <span class="slider round"></span>
      </label>
    </div>

    <!-- Accordion Sections -->
    <div class="accordion">
      <!-- Connection Config Header -->
      <button class="accordion-trigger" id="btn-config">
        <span class="trigger-label">Connection Settings</span>
        <span class="arrow">▲</span>
      </button>
      <div class="accordion-content active" id="panel-config">
        <div class="form-group row">
          <div class="form-col">
            <label for="input-protocol">Protocol</label>
            <select id="input-protocol">
              <option value="ws">WebSocket (ws)</option>
              <option value="http">HTTP POST</option>
            </select>
          </div>
          <div class="form-col">
            <label for="input-host">Host</label>
            <input type="text" id="input-host" placeholder="localhost">
          </div>
        </div>
        <div class="form-group row">
          <div class="form-col">
            <label for="input-port">Port</label>
            <input type="text" id="input-port" placeholder="6161">
          </div>
          <div class="form-col">
            <label for="input-path">Path</label>
            <input type="text" id="input-path" placeholder="/">
          </div>
        </div>
        <div id="test-result" class="test-result hidden"></div>
      </div>

      <!-- CSS Selectors Header -->
      <button class="accordion-trigger" id="btn-selectors">
        <span class="trigger-label">DOM Selectors</span>
        <span class="arrow">▼</span>
      </button>
      <div class="accordion-content" id="panel-selectors">
        <div class="form-group">
          <label for="sel-container">Chat Container</label>
          <input type="text" id="sel-container" placeholder=".webcast-chatroom___list">
        </div>
        <div class="form-group">
          <label for="sel-node">Comment Node</label>
          <input type="text" id="sel-node" placeholder=".webcast-chatroom___item">
        </div>
        <div class="form-group row">
          <div class="form-col">
            <label for="sel-nickname">Nickname</label>
            <input type="text" id="sel-nickname" placeholder=".nickname">
          </div>
          <div class="form-col">
            <label for="sel-username">Username</label>
            <input type="text" id="sel-username" placeholder=".username">
          </div>
        </div>
        <div class="form-group row">
          <div class="form-col-full">
            <label for="sel-message">Message Content</label>
            <input type="text" id="sel-message" placeholder=".content">
          </div>
        </div>
        <div class="form-group row">
          <div class="form-col-full">
            <label for="sel-profile">Profile Picture</label>
            <input type="text" id="sel-profile" placeholder="img">
          </div>
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar" style="gap: 8px;">
      <button id="btn-test-conn" class="btn-secondary">Test Connection</button>
      <button id="btn-save" class="btn-primary">Save Configuration</button>
    </div>

    <!-- Live Preview Feed -->
    <section class="feed-section">
      <div class="feed-header">
        <h3>Live Comments <span class="badge">Session Preview</span></h3>
        <span id="comment-count" class="counter">0 / 20</span>
      </div>
      <div id="comment-feed" class="comment-feed">
        <!-- Comments will be dynamically appended here -->
        <div class="empty-feed" id="empty-feed">
          No comments yet. Enable monitoring on a live stream to start viewing.
        </div>
      </div>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
